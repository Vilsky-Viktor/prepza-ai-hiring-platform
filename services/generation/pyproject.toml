[project]
name = "generation"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "prepza-common[llm,langfuse]",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=5.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

# The shared package, from this repo. To use a published version, drop this source and require
# a version above instead (see packages/common/README.md).
[tool.uv.sources]
prepza-common = { path = "../../packages/common", editable = true }

[tool.pytest.ini_options]
pythonpath = [".", "../../packages/common/tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

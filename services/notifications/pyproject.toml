[project]
name = "notifications"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "prepza-common[money]",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
    "alembic>=1.20.0",
    "firebase-admin>=7.7.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.1",
    "redis>=8.1.0",
    "markdown-it-py>=4",
]

[tool.uv.sources]
prepza-common = { path = "../../packages/common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

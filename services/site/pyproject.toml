[project]
name = "site"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "testee-common[money]",
    "babel>=2.17",
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
testee-common = { path = "../../packages/common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/common/tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
]

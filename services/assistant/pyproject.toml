[project]
name = "assistant"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "testee-common[llm,langfuse]",
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
    "openai>=3.26.1",
    "mcp>=2.2,<3",
]

# The shared package, from this repo. To use a published version, drop this source and require
# a version above instead (see packages/common/README.md).
[tool.uv.sources]
testee-common = { path = "../../packages/common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/common/tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
]

name: Dependency audit

# Fails when a package the services or the frontend ship has a known high-severity vulnerability,
# or when a commit carries a secret: on every push to a pull request and to main, and every Monday,
# so a new advisory shows up even when nothing changes. On Mondays (or run by hand) it also builds
# every production image and scans its OS packages, which CI scans only when a part changes.
# Dependabot (dependabot.yml) proposes the fixed versions.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.path }} audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        path:
          - packages/common
          - services/api
          - services/assistant
          - services/ats
          - services/billing
          - services/companies
          - services/generation
          - services/library
          - services/notifications
          - services/rounds
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
      # The locked packages a production image installs; the shared package is ours, not on PyPI.
      - run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --no-emit-package prepza-common > /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt --disable-pip --no-deps --progress-spinner off

  frontend:
    name: frontend audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - run: pnpm audit --prod --audit-level=high

  # Every commit of the history (about 20 seconds), with gitleaks's default rules and the made-up
  # values .gitleaks.toml allows. The binary is pinned and checked against its checksum.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner

  # Each production image built from main and scanned as CI scans a changed one (trivy.yaml), so a
  # new advisory for an unchanged image's OS packages shows up within a week.
  images:
    name: ${{ matrix.name }} image scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: library, context: ., file: services/library/Dockerfile }
          - { name: generation, context: ., file: services/generation/Dockerfile }
          - { name: rounds, context: ., file: services/rounds/Dockerfile }
          - { name: companies, context: ., file: services/companies/Dockerfile }
          - { name: billing, context: ., file: services/billing/Dockerfile }
          - { name: notifications, context: ., file: services/notifications/Dockerfile }
          - { name: ats, context: ., file: services/ats/Dockerfile }
          - { name: api, context: ., file: services/api/Dockerfile }
          - { name: assistant, context: ., file: services/assistant/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The frontend gets CI's placeholder public settings, as for a pull request.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          platforms: linux/amd64
          push: false
          load: true
          tags: prepza/${{ matrix.name }}:audit
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=demo-api-key
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-prepza.firebaseapp.com
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=demo-prepza
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: prepza/${{ matrix.name }}:audit
          trivy-config: trivy.yaml

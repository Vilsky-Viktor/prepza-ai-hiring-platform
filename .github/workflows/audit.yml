name: Dependency audit

# Fails when a package the services or the frontend ship has a known high-severity vulnerability:
# on every push to a pull request and to main, and every Monday, so a new advisory shows up even
# when nothing changes. Dependabot (dependabot.yml) proposes the fixed versions.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.path }} audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        path:
          - packages/common
          - services/api
          - services/assistant
          - services/ats
          - services/billing
          - services/companies
          - services/generation
          - services/library
          - services/notifications
          - services/rounds
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
      # The locked packages a production image installs; the shared package is ours, not on PyPI.
      - run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --no-emit-package prepza-common > /tmp/requirements.txt
          uvx pip-audit==2.9.0 -r /tmp/requirements.txt --disable-pip --no-deps --progress-spinner off

  frontend:
    name: frontend audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - run: pnpm audit --prod --audit-level=high

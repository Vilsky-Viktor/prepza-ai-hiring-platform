name: Checks

# The fast checks of the whole repo, on every push to a pull request and to main: Python lint and
# format, the migration check, the scripts' tests, file sizes, the shell scripts and workflows, and
# Terraform. They take a minute or two, so they run whatever changed. deploy.yml releases only a
# commit these and CI (ci.yml) passed on.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The ruff version is pinned: newer versions enable more rules by default.
env:
  RUFF_VERSION: "0.16.10"

jobs:
  lint:
    name: python lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
      - run: uvx "ruff@$RUFF_VERSION" check services packages evals
      - run: uvx "ruff@$RUFF_VERSION" format --check services packages evals
      - run: scripts/check_migrations.py && uvx --with pytest pytest -q scripts/tests

  # Rule 2: no hand-written file over 300 lines.
  size:
    name: file size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check_file_size.sh

  # Every shell script with ShellCheck, and the workflows with actionlint and zizmor (its offline
  # audits: template injection, permissions, pinning, credentials). The tools are pinned, the
  # downloads checked against their checksums.
  workflows:
    name: workflow and script lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: "1.31.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          curl -sSfL -o /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install "/tmp/shellcheck-v$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
          git ls-files -z '*.sh' | xargs -0 shellcheck
      # actionlint also runs ShellCheck (installed above) on each run: block.
      - name: actionlint
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
      - name: zizmor
        run: uvx "zizmor@$ZIZMOR_VERSION" --offline .github

  # Terraform's format, configuration and lint, without credentials or state (no backend), so it
  # runs on pull requests too.
  terraform:
    name: terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false && terraform validate
      # TFLint (.tflint.hcl): Terraform's recommended rules, typed and described variables, described
      # outputs. Pinned, the download checked against its checksum.
      - name: TFLint
        env:
          TFLINT_VERSION: "0.64.0"
          TFLINT_SHA256: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537
        run: |
          curl -sSfL -o /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v$TFLINT_VERSION/tflint_linux_amd64.zip"
          echo "$TFLINT_SHA256  /tmp/tflint.zip" | sha256sum -c -
          unzip -q /tmp/tflint.zip -d /tmp
          /tmp/tflint --format compact

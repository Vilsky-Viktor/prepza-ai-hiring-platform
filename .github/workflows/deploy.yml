name: Deploy

# Releases a version: a v* tag on a commit of main that passed CI. CI already built and pushed that
# commit's images, so nothing is rebuilt: the images get the version as a tag and ship by digest.
# Running it by hand with an earlier tag redeploys that version, which is how to roll back: a manual
# run skips migrations unless asked, as an older version's `alembic upgrade head` fails on a
# database a newer one migrated. So migrations only add (columns, tables) and the previous version
# keeps working on the new schema; dropping or renaming comes in a later release. Infrastructure
# changes go through Terraform (infra/); this only runs migrations and moves services to images.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to deploy, for example v1.4.0
        required: true
      migrate:
        description: Run migrations (leave off to roll back to an earlier version)
        type: boolean
        default: false

# One deploy at a time, in order.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/prepza
  VERSION: ${{ inputs.tag || github.ref_name }}
  SERVICES: library generation rounds companies billing notifications ats api assistant accounts site frontend

jobs:
  verify:
    name: check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads CI's runs for the commit.
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: commit
        name: The version is a tag on main that passed CI and the checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$VERSION is not a version like v1.4.0" >&2

            exit 1
          fi

          sha="$(git rev-parse "refs/tags/$VERSION^{commit}")"

          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "$VERSION ($sha) is not on main" >&2

            exit 1
          fi

          # CI pushes images only for the commit a push to main ends on, so that's what to tag. The
          # repo's fast checks (checks.yml) must have passed on it too.
          for workflow in ci.yml checks.yml; do
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$sha&event=push&status=success" --jq .total_count)"

            if [[ "$passed" == "0" ]]; then
              echo "$workflow didn't pass on $sha (it failed, or a later push replaced its run): tag the latest commit it passed on" >&2

              exit 1
            fi
          done

          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: migrate and deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Settings → Environments → production can require an approval before this runs.
    environment: production
    permissions:
      contents: read
      # Lets GitHub sign the token Google exchanges for the deploy account (no stored key).
      id-token: write
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.VERSION }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # The images CI built for the commit also get the version's name, as a label; adding it again
      # is harmless. Each image's digest is read once from the commit's tag, and every step below
      # deploys image@sha256:…, so what ships is exactly what CI built and tested, whatever a tag
      # points to later. IMAGE_LIBRARY, IMAGE_FRONTEND and so on hold them.
      - name: Version the images and read their digests
        run: |
          for name in $SERVICES; do
            gcloud artifacts docker tags add "$REGISTRY/$name:$SHA" "$REGISTRY/$name:$VERSION" --quiet
            digest="$(gcloud artifacts docker images describe "$REGISTRY/$name:$SHA" --format='value(image_summary.digest)')"

            if [[ "$digest" != sha256:* ]]; then
              echo "No digest for $name:$SHA" >&2

              exit 1
            fi

            echo "IMAGE_${name^^}=$REGISTRY/$name@$digest" >> "$GITHUB_ENV"
          done
      # Each service's own database user, owning only its database; safe to repeat. Runs before
      # migrations, which connect as those users.
      - name: Database users
        run: |
          gcloud run jobs update db-roles --image="$IMAGE_LIBRARY" --region="$REGION" --quiet
          gcloud run jobs execute db-roles --region="$REGION" --wait --quiet
      # Migrations run before any service moves, so new code never meets an old schema.
      - name: Migrations
        if: github.event_name == 'push' || inputs.migrate
        run: |
          for db in library generation rounds companies billing notifications ats api assistant accounts site; do
            image="IMAGE_${db^^}"
            gcloud run jobs update "$db-migrate" --image="${!image}" --region="$REGION" --quiet
            gcloud run jobs execute "$db-migrate" --region="$REGION" --wait --quiet
          done
      - name: Services
        run: |
          deploy() {
            local image="IMAGE_${2^^}"
            gcloud run services update "$1" --image="${!image}" --region="$REGION" --quiet
          }

          deploy library library
          deploy generation generation
          deploy generation-worker generation
          deploy rounds rounds
          deploy companies companies
          deploy billing billing
          deploy notifications notifications
          deploy notifications-stream notifications
          deploy ats ats
          deploy api api
          deploy assistant assistant
          deploy accounts accounts
          deploy site site
          deploy frontend frontend
      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: ./e2e_tests/smoke.sh "$SITE_URL"

      # The services already run the new images: nothing rolls back by itself.
      - name: How to roll back
        if: failure()
        run: |
          echo "::error::The deploy failed after its first step, so services may run the new images. If the site is broken, roll back: Actions → Deploy → Run workflow with the previous version (the last v* tag before $VERSION), Run migrations off. See infra/README.md (Rolling back)."

  release:
    name: GitHub release
    needs: deploy
    # A new tag gets its release notes; redeploying an earlier version (a rollback) doesn't.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

name: CI

# Every push to a pull request, and every push to main: each changed part's tests and image, and the
# whole stack's tests. On main it also pushes the production images, tagged with the commit, for
# deploy.yml to release. The fast checks of the whole repo (lint, file size, Terraform) are in
# checks.yml.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run for the previous one. On main, runs go one at a
# time and one waits: a push made while another waits replaces it, and its run, compared with the
# last commit CI passed on, builds both. The replaced commit gets no images, so it can't be
# released (deploy.yml refuses it): tag the later one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/prepza
  # Only main pushes images: pull requests just check that they build.
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # What changed, so only that is tested and built (scripts/ci_changes.sh). A pull request compares
  # with its base; main compares with the last commit CI passed on (runs on main go one at a time),
  # so a failed run's changes are built by the next one.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      stack: ${{ steps.diff.outputs.stack }}
      base: ${{ steps.diff.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci_changes.sh

  # Every part keeps its job, so required checks always report; an unchanged part skips its steps.
  tests:
    name: ${{ matrix.path }} tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: library, path: services/library }
          - { name: generation, path: services/generation }
          - { name: rounds, path: services/rounds }
          - { name: companies, path: services/companies }
          - { name: notifications, path: services/notifications }
          - { name: billing, path: services/billing }
          - { name: ats, path: services/ats }
          - { name: api, path: services/api }
          - { name: assistant, path: services/assistant }
          - { name: common, path: packages/common }
    env:
      CHANGED: ${{ contains(fromJSON(needs.changes.outputs.changed), matrix.name) }}
      BASE: ${{ needs.changes.outputs.base }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - if: env.CHANGED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: env.CHANGED == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          working-directory: ${{ matrix.path }}
      - if: env.CHANGED == 'true'
        run: uv sync --locked
      - if: env.CHANGED == 'true'
        run: uv run pytest -q --cov=src --cov-report=xml
      # The share of the changed lines the unit tests run, in the job's summary (docs/testing.md).
      - if: env.CHANGED == 'true'
        run: ../../scripts/changed_lines_coverage.sh coverage.xml

  frontend:
    name: frontend lint and types
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changed), 'frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: ${{ needs.changes.outputs.base }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Every translation has en.json's keys, arguments and tags, in valid ICU syntax.
      - run: pnpm check:messages
      - run: pnpm test --coverage
      - run: ../scripts/changed_lines_coverage.sh coverage/cobertura-coverage.xml

  # A changed part's image is built (and, on main, pushed). On main, an unchanged one is the image
  # of the last commit CI passed on, tagged with this commit too, so every image exists for every
  # commit deploy.yml may release.
  images:
    name: ${{ matrix.name }} production image
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Lets GitHub sign the token Google exchanges for the CI account (no stored key).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The API images are built from the repo root, as they include packages/common.
          - { name: library, context: ., file: services/library/Dockerfile }
          - { name: generation, context: ., file: services/generation/Dockerfile }
          - { name: rounds, context: ., file: services/rounds/Dockerfile }
          - { name: companies, context: ., file: services/companies/Dockerfile }
          - { name: billing, context: ., file: services/billing/Dockerfile }
          - { name: notifications, context: ., file: services/notifications/Dockerfile }
          - { name: ats, context: ., file: services/ats/Dockerfile }
          - { name: api, context: ., file: services/api/Dockerfile }
          - { name: assistant, context: ., file: services/assistant/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
    env:
      CHANGED: ${{ contains(fromJSON(needs.changes.outputs.changed), matrix.name) }}
      BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          # Push only: CI can't deploy (infra/terraform/github.tf).
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - if: env.PUBLISH == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - if: env.PUBLISH == 'true'
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - if: env.PUBLISH == 'true' && env.CHANGED != 'true'
        name: Tag the unchanged image
        env:
          NAME: ${{ matrix.name }}
        run: gcloud artifacts docker tags add "$REGISTRY/$NAME:$BASE" "$REGISTRY/$NAME:$GITHUB_SHA" --quiet
      - if: env.CHANGED == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.CHANGED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          # Cloud Run runs x86.
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          load: true
          # Published images go to the registry; others (pull requests) only need a valid local tag,
          # as the registry's settings exist only where images are published.
          tags: ${{ env.PUBLISH == 'true' && format('{0}/{1}:{2}', env.REGISTRY, matrix.name, github.sha) || format('prepza/{0}:{1}', matrix.name, github.sha) }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # The frontend bakes its public settings in at build time: the real ones for the images
          # main pushes, placeholders for pull requests.
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ env.PUBLISH == 'true' && vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'demo-api-key' }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ env.PUBLISH == 'true' && vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'demo-prepza.firebaseapp.com' }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ env.PUBLISH == 'true' && vars.GCP_PROJECT_ID || 'demo-prepza' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.PUBLISH == 'true' && vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
            FRONTEND_SENTRY_DSN=${{ env.PUBLISH == 'true' && vars.FRONTEND_SENTRY_DSN || '' }}
            NEXT_PUBLIC_ENVIRONMENT=${{ env.PUBLISH == 'true' && 'production' || '' }}
            SENTRY_ORG=${{ env.PUBLISH == 'true' && vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ env.PUBLISH == 'true' && vars.SENTRY_PROJECT || '' }}
          # Uploads the frontend's source maps to Sentry; a secret, so it stays out of the image.
          secrets: |
            sentry_auth_token=${{ env.PUBLISH == 'true' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - name: Scan the image's OS packages (trivy.yaml)
        if: env.CHANGED == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.PUBLISH == 'true' && format('{0}/{1}:{2}', env.REGISTRY, matrix.name, github.sha) || format('prepza/{0}:{1}', matrix.name, github.sha) }}
          trivy-config: trivy.yaml

  smoke:
    name: smoke test (whole stack)
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The example settings run everything locally: the Firebase emulator, mailpit, no OpenAI key.
      # The signed-in tests' superadmin is a CI-only account the emulator makes up.
      - run: |
          cp .env.example .env
          sed -i 's/^SUPERADMIN_EMAILS=.*/SUPERADMIN_EMAILS=ci-superadmin@example.com/' .env
      - run: docker compose up --build -d
      # Waits for the services and the frontend's first compile, then checks pages and /ready.
      - name: Smoke test
        run: |
          for _ in $(seq 1 40); do
            if ./e2e_tests/smoke.sh; then
              exit 0
            fi

            sleep 15
          done

          exit 1
      # The assistant's tools are built from the services' OpenAPI snapshots: a changed route must
      # come with refreshed snapshots (scripts/assistant-openapi.sh, committed).
      - name: Assistant's OpenAPI snapshots are current
        run: |
          ./scripts/assistant-openapi.sh
          git diff --exit-code services/assistant/src/assistant/openapi
      # The frontend's API types are generated from the same services through the gateway: a changed
      # route or schema must come with refreshed types (`pnpm api-types`, committed).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend's API types are current
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm api-types
          git diff --exit-code src/types/api
      # Each service's tests/integration, against the stack's real Postgres and Redis.
      - name: Integration tests
        run: ./scripts/integration.sh
      # An AI app connecting over MCP through the gateway: OAuth with PKCE, the consent page's
      # API, tools as the user, refresh, revoke and disconnect (an emulator user, no OpenAI).
      - name: MCP end-to-end test
        run: python3 e2e_tests/mcp.py
      # The signed-out pages in a real browser (Playwright's image), on desktop and phone sizes.
      - name: Page tests
        run: ./e2e_tests/pages.sh
      # The signed-in pages through the Auth emulator. Interviews are made from templates, and the
      # database has none: a small English one is added first (no OpenAI).
      - name: Signed-in tests
        run: |
          docker compose exec -T library uv run --no-sync python - < e2e_tests/signed-in/seed/template.py
          ./e2e_tests/signed-in.sh
      - name: Signed-in test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-in-test-results
          path: e2e_tests/signed-in/test-results
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down -v

# Weekly pull requests that update the pinned images (tag and digest: base images and the local
# stack's), GitHub Actions (pinned by commit) and the frontend's and services' packages (their lock
# files). A new version waits a week (cooldown), so a hijacked release is usually pulled before it's
# proposed; security updates don't wait. Merge after CI passes; close to skip a version.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /database
      - /firebase
      - /frontend
      - /services/accounts
      - /services/ats
      - /services/api
      - /services/assistant
      - /services/billing
      - /services/companies
      - /services/generation
      - /services/library
      - /services/notifications
      - /services/rounds
      - /services/site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
    # Minor and patch updates only: a new major (Node 26, Python 3.15, Postgres 19) is planned by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The local and CI stack's other images (compose/), pinned the same way.
  - package-ecosystem: docker-compose
    directory: /compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directories:
      - /packages/common
      - /services/accounts
      - /services/api
      - /services/assistant
      - /services/ats
      - /services/billing
      - /services/companies
      - /services/generation
      - /services/library
      - /services/notifications
      - /services/rounds
      - /services/site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

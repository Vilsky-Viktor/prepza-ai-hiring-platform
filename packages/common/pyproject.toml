[project]
name = "prepza-common"
version = "0.1.0"
description = "Code shared by prepza's services: sign-in, service tokens, logging, database, Redis and HTTP setup."
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "google-auth[requests]>=2.40.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

# Only the services that call OpenAI install it: `prepza-common[llm]` (prepza_common.llm).
[project.optional-dependencies]
llm = ["langchain-openai>=1.6.6"]
# The chats' traces and votes in Langfuse (prepza_common.answer_votes): the assistant and rounds.
langfuse = ["langfuse>=5.0.2"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prepza-common[llm,langfuse]",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

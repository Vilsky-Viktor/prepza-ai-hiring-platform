[project]
name = "testee-common"
version = "0.1.0"
description = "Code shared by testee's services: sign-in, service tokens, logging, database, Redis and HTTP setup."
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "google-auth[requests]>=2.40.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.71.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

# Only the services that call OpenAI install it: `testee-common[llm]` (testee_common.ai.llm).
[project.optional-dependencies]
llm = ["langchain-openai>=1.6.6"]
# Tracing AI calls to Langfuse (testee_common.ai.tracing) and the chats' votes there
# (testee_common.ai.answer_votes): the services that call AI (with `llm`).
langfuse = ["langfuse>=5.0.2"]
# Money and counted nouns as a language writes them (testee_common.i18n.money, .plurals): site,
# billing and notifications.
money = ["babel>=2.17"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "testee-common[llm,langfuse,money]",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]

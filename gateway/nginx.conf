map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# A general limit per IP, as Cloud Armor's in production (infra/terraform/edge_security.tf): about
# 600 requests a minute. Static files outside /api don't count, and neither do ports 8081 and 8082,
# which only the stack's own containers reach: 8081 for the frontend's server-side calls (all
# visitors' at once, as the NAT's address is left out in production) and the load tests, 8082 for
# the browser tests (every parallel browser from one address). An empty key isn't counted.
map $uri $limit_by_path {
    ~^/api/ $binary_remote_addr;
    ~*^/_next/(static|image)/ "";
    ~*\.(css|js|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|mp4|webm|pdf)$ "";
    default $binary_remote_addr;
}

map $server_port $limit_key {
    8081 "";
    8082 "";
    default $limit_by_path;
}

# The site's pages: the browser tests' port (8082, e2e_tests/test_frontend.sh) gets the frontend's
# production build, every other port the dev server. The API is the same on every port.
map $server_port $frontend {
    8082 frontend-test:3000;
    default frontend:3000;
}

limit_req_zone $limit_key zone=per_ip:10m rate=600r/m;

server {
    listen 80;
    listen 8081;
    listen 8082;

    limit_req zone=per_ip burst=300 nodelay;
    limit_req_status 429;

    # No nginx version in answers or error pages; the services send no server header either.
    server_tokens off;

    # Docker's DNS. Upstreams are variables so nginx re-resolves them after containers are
    # recreated instead of keeping the IPs it saw at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers on every response. The frontend adds its own Content-Security-Policy,
    # which needs a fresh nonce per page. HSTS only takes effect over HTTPS. The opener policy
    # keeps other sites' windows from reaching ours, but lets the sign-in popups we open (Google,
    # LinkedIn, GitHub, through Firebase) report back.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The visitor's country, which production's load balancer sets from their address
    # (infra/terraform/load_balancer.tf), replacing any the browser sent, and prices follow where
    # no currency is saved; locally a `test_country` cookie ("DE", "GB") stands in.
    proxy_set_header X-Client-Country $cookie_test_country;

    # Service-to-service endpoints are never reachable from outside.
    location ~ ^/api/[^/]+/internal/ {
        return 404;
    }

    # A company's prices, currency, checkouts, invoices, failed payments and automatic top-up
    # are billing's, which checks the member itself, at the addresses companies had (as
    # infra/terraform/load_balancer.tf routes them). A regex, so it wins over /api/companies/.
    location ~ ^/api/companies/companies/[^/]+/(billing/(catalog|currency|checkout|invoice|payment-failure)|auto-top-up(/card)?)$ {
        set $upstream billing:8000;
        rewrite ^/api/companies/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /api/library/ {
        set $upstream library:8000;
        rewrite ^/api/library/(.*)$ /$1 break;
        # Above library's own 120s wait on question re-generation.
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    location /api/accounts/ {
        set $upstream accounts:8000;
        rewrite ^/api/accounts/(.*)$ /$1 break;
        # Above an account's deletion or download, which waits on every service.
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    location /api/site/ {
        set $upstream site:8000;
        rewrite ^/api/site/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    location /api/generate/ {
        set $upstream generation:8000;
        rewrite ^/api/generate/(.*)$ /$1 break;
        # Generation calls wait on the LLM, which can take over a minute.
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    # Candidates' sessions; in voice mode, their spoken answers are uploaded (up to 2 MB).
    location /api/rounds/ {
        set $upstream rounds:8000;
        rewrite ^/api/rounds/(.*)$ /$1 break;
        client_max_body_size 3m;
        proxy_pass http://$upstream;
    }

    location /api/companies/ {
        set $upstream companies:8000;
        rewrite ^/api/companies/(.*)$ /$1 break;
        # Above companies' own 120s wait on question re-generation.
        proxy_read_timeout 150s;
        # A report's PDF, base64 in JSON (the service's own limit is 2 MB).
        client_max_body_size 2m;
        proxy_pass http://$upstream;
    }

    location /api/billing/ {
        set $upstream billing:8000;
        rewrite ^/api/billing/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # ATS integrations, and the webhooks Workable and Greenhouse send.
    location /api/ats/ {
        set $upstream ats:8000;
        rewrite ^/api/ats/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # The public API (companies' keys) and the company's API page: /api/v1/... is the api service.
    location /api/v1/ {
        set $upstream api:8000;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream;
    }

    # The bell (its live stream included) and Resend's webhooks (bounces, complaints). The stream
    # sends a heartbeat every 20 seconds, well inside the read timeout.
    location /api/notifications/ {
        set $upstream notifications:8000;
        rewrite ^/api/notifications/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://$upstream;
    }

    # The in-app assistant: answers stream as server-sent events while its tools call the other
    # services (a turn takes up to 90 seconds), and voice messages are uploaded (up to 2 MB).
    location /api/assistant/ {
        set $upstream assistant:8000;
        rewrite ^/api/assistant/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
        client_max_body_size 3m;
        proxy_pass http://$upstream;
    }

    # AI apps (Claude, ChatGPT, ...): the assistant's MCP endpoint and its OAuth authorization
    # server (metadata, /authorize, /token, /register, /revoke) live at the site's root, where
    # the OAuth and MCP specs look for them. Exact paths only, so they never take a frontend
    # page: no page may use these paths. Proxied as they are, without a rewrite.
    location ~ ^/(mcp|authorize|token|register|revoke|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource(/mcp)?)$ {
        set $upstream assistant:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_pass http://$upstream;
    }

    # The site's pages say themselves who may frame them (their Content-Security-Policy's
    # frame-ancestors: no one, but a company's own site its embedded interview), so they get the
    # headers above without X-Frame-Options, which would forbid that one too. An add_header here
    # replaces the server's, so each is repeated.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        set $upstream $frontend;
        # Pages stream in as the frontend renders them (a page's frame before its data), and are
        # compressed here, as Cloud CDN does in production (infra/terraform/load_balancer.tf); the
        # frontend sends them uncompressed (next.config.ts `compress`).
        proxy_buffering off;
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/xml application/xml application/rss+xml text/x-component;
        # As above: this block's own proxy_set_header replaces all of the server's, so each is
        # repeated, and the frontend sees the visitor's host as behind the load balancer.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Country $cookie_test_country;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_pass http://$upstream;
    }
}

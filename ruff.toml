# The services are written to 100 columns; without this, ruff would rewrap them to 88.
line-length = 100
# Each service has its own first-party package in `src/<service>` (python-services.md).
src = ["services/*/src", "database/roles/src"]

# Rule 2: a function's branching stays readable. Test fakes and migrations are exempt.
[lint]
extend-select = ["C90", "PLR0912", "PLR0915"]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"**/tests/**" = ["C90", "PLR0912", "PLR0915"]
"**/migrations/**" = ["C90", "PLR0912", "PLR0915"]

[lint.isort]
# The shared package is installed like any other dependency.
known-first-party = ["api", "ats", "rounds", "billing", "library", "notifications", "assistant", "companies", "generation", "accounts", "site_content", "db_roles"]
known-third-party = ["testee_common"]

# The services around them: billing, notifications (email and Slack), ATS integrations, the
# public API, the in-app assistant and users' accounts; each with its migrations, run first.

x-billing-env: &billing-env
  DATABASE_URL: postgresql://billing:${POSTGRES_PASSWORD}@postgres:5432/billing
  # The limits' values every service reads, and the unpaid AI spend cap's counter.
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  # The AI costs tab names companies and accounts.
  COMPANIES_URL: http://companies:8000
  ACCOUNTS_URL: http://accounts:8000
  PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
  PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
  PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
  PADDLE_PRODUCT_CANDIDATES: ${PADDLE_PRODUCT_CANDIDATES:-}
  PADDLE_PRICE_AUTO_TOP_UP: ${PADDLE_PRICE_AUTO_TOP_UP:-}
  PADDLE_API_KEY: ${PADDLE_API_KEY:-}

x-notifications-env: &notifications-env
  DATABASE_URL: postgresql://notifications:${POSTGRES_PASSWORD}@postgres:5432/notifications
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  MAIL_FROM: ${MAIL_FROM:-prepza. <no-reply@prepza.local>}
  # The digest and reminders: their own sender, so complaints about them can't hurt the others.
  MAIL_FROM_UPDATES: ${MAIL_FROM_UPDATES:-prepza. <updates@mail.prepza.local>}
  # Candidates' emails, watched apart; empty: MAIL_FROM.
  MAIL_FROM_CANDIDATES: ${MAIL_FROM_CANDIDATES:-}
  COMPANIES_URL: http://companies:8000
  # Users' addresses, languages and email settings; site has the news the bell names.
  ACCOUNTS_URL: http://accounts:8000
  SITE_SERVICE_URL: http://site:8000
  # The reminders ask billing for low credits and generation for topics waiting for review.
  BILLING_URL: http://billing:8000
  GENERATION_URL: http://generation:8000
  # Campaigns ask rounds for their candidates and learners.
  ROUNDS_URL: http://rounds:8000
  # Signs emails' unsubscribe links; in Google Cloud it's a generated secret.
  EMAIL_LINK_SECRET: ${EMAIL_LINK_SECRET:-local-email-link-secret}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SITE_URL: ${SITE_URL:-http://localhost:8090}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-hello@prepza.ai}
  SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
  SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
  SLACK_ENCRYPTION_KEY: ${SLACK_ENCRYPTION_KEY:-}

x-ats-env: &ats-env
  DATABASE_URL: postgresql://ats:${POSTGRES_PASSWORD}@postgres:5432/ats
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  COMPANIES_URL: http://companies:8000
  # Encrypts companies' ATS keys (a Fernet key); empty turns ATS integrations off.
  ATS_ENCRYPTION_KEY: ${ATS_ENCRYPTION_KEY:-}
  # The site's address: where an ATS sends candidates, and links in results written back.
  SITE_URL: ${SITE_URL:-http://localhost:8090}

x-api-env: &api-env
  DATABASE_URL: postgresql://api:${POSTGRES_PASSWORD}@postgres:5432/api
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  COMPANIES_URL: http://companies:8000
  # Encrypts web hooks' signing secrets (a Fernet key); empty, web hooks can't be added.
  API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:-}
  # The site's address: links to candidates' results in what the API returns.
  SITE_URL: ${SITE_URL:-http://localhost:8090}

x-assistant-env: &assistant-env
  DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD}@postgres:5432/assistant
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
  ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-6-luna}
  ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-low}
  TITLE_MODEL: ${TITLE_MODEL:-gpt-6-luna}
  TITLE_REASONING_EFFORT: ${TITLE_REASONING_EFFORT:-none}
  ROUTING_MODEL: ${ROUTING_MODEL:-gpt-6-luna}
  ROUTING_REASONING_EFFORT: ${ROUTING_REASONING_EFFORT:-none}
  TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-gpt-transcribe}
  HELP_MODEL: ${HELP_MODEL:-gpt-6-luna}
  HELP_REASONING_EFFORT: ${HELP_REASONING_EFFORT:-none}
  # The "I'm not a robot" check on a visitor's first help chat message.
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
  # AI apps connect to <SITE_URL>/mcp; their calls sign the user in with Firebase's web key.
  SITE_URL: ${SITE_URL:-http://localhost:8090}
  FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-demo-api-key}
  # The services whose GET routes are its tools, called with the user's own token; site also
  # sends the help chat what it answers from.
  COMPANIES_URL: http://companies:8000
  BILLING_URL: http://billing:8000
  LIBRARY_URL: http://library:8000
  ACCOUNTS_URL: http://accounts:8000
  NOTIFICATIONS_URL: http://notifications:8000
  ATS_URL: http://ats:8000
  API_URL: http://api:8000
  ROUNDS_URL: http://rounds:8000
  SITE_SERVICE_URL: http://site:8000

x-accounts-env: &accounts-env
  DATABASE_URL: postgresql://accounts:${POSTGRES_PASSWORD}@postgres:5432/accounts
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  # Every service holding part of a user's data, for downloading an account (deleting one is
  # companies' call, then the user.deleted event); billing also sets a new account's currency.
  COMPANIES_URL: http://companies:8000
  ROUNDS_URL: http://rounds:8000
  GENERATION_URL: http://generation:8000
  BILLING_URL: http://billing:8000
  NOTIFICATIONS_URL: http://notifications:8000
  ATS_URL: http://ats:8000
  API_URL: http://api:8000
  ASSISTANT_URL: http://assistant:8000
  LIBRARY_URL: http://library:8000
  SITE_SERVICE_URL: http://site:8000

# Each service's mounted source; migrations read it too, so new ones run without a rebuild.
x-billing-source: &billing-source
  - ./services/billing/src:/services/billing/src
  - ./services/billing/migrations:/services/billing/migrations
  - ./services/billing/alembic.ini:/services/billing/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-notifications-source: &notifications-source
  - ./services/notifications/src:/services/notifications/src
  - ./services/notifications/migrations:/services/notifications/migrations
  - ./services/notifications/alembic.ini:/services/notifications/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-ats-source: &ats-source
  - ./services/ats/src:/services/ats/src
  - ./services/ats/migrations:/services/ats/migrations
  - ./services/ats/alembic.ini:/services/ats/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-api-source: &api-source
  - ./services/api/src:/services/api/src
  - ./services/api/migrations:/services/api/migrations
  - ./services/api/alembic.ini:/services/api/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-assistant-source: &assistant-source
  - ./services/assistant/src:/services/assistant/src
  - ./services/assistant/migrations:/services/assistant/migrations
  - ./services/assistant/alembic.ini:/services/assistant/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-accounts-source: &accounts-source
  - ./services/accounts/src:/services/accounts/src
  - ./services/accounts/migrations:/services/accounts/migrations
  - ./services/accounts/alembic.ini:/services/accounts/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

services:
  billing-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/billing/Dockerfile
      target: dev
    volumes: *billing-source
    environment: *billing-env

  billing:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/billing/Dockerfile
      target: dev
    volumes: *billing-source
    environment: *billing-env
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  notifications-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
      target: dev
    volumes: *notifications-source
    environment: *notifications-env

  notifications:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
      target: dev
    volumes: *notifications-source
    environment: *notifications-env
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  ats-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/ats/Dockerfile
      target: dev
    volumes: *ats-source
    environment: *ats-env

  ats:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/ats/Dockerfile
      target: dev
    volumes: *ats-source
    environment: *ats-env
    depends_on:
      ats-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: dev
    volumes: *api-source
    environment: *api-env

  api:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: dev
    volumes: *api-source
    environment: *api-env
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  assistant-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/assistant/Dockerfile
      target: dev
    volumes: *assistant-source
    environment: *assistant-env

  assistant:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/assistant/Dockerfile
      target: dev
    volumes: *assistant-source
    environment: *assistant-env
    depends_on:
      assistant-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  accounts-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/accounts/Dockerfile
      target: dev
    volumes: *accounts-source
    environment: *accounts-env

  accounts:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/accounts/Dockerfile
      target: dev
    volumes: *accounts-source
    environment: *accounts-env
    depends_on:
      accounts-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

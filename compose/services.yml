# The services behind the tests: the question bank (library), question generation and its worker,
# practice rounds, and companies; each with its migrations, run first.

x-library-env: &library-env
  DATABASE_URL: postgresql://library:${POSTGRES_PASSWORD}@postgres:5432/library
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  GENERATION_URL: http://generation:8000

x-generation-env: &generation-env
  DATABASE_URL: postgresql://generation:${POSTGRES_PASSWORD}@postgres:5432/generation
  REDIS_URL: redis://redis:6379
  LIBRARY_URL: http://library:8000
  SERVICE_SECRET: ${SERVICE_SECRET}
  INTERVIEW_MODEL: ${INTERVIEW_MODEL:-gpt-6.1-sol}
  INTERVIEW_REASONING_EFFORT: ${INTERVIEW_REASONING_EFFORT:-low}
  VERIFY_MODEL: ${VERIFY_MODEL:-gpt-6.1-sol}
  VERIFY_REASONING_EFFORT: ${VERIFY_REASONING_EFFORT:-medium}
  TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gpt-6.1-sol}
  TRANSLATION_REASONING_EFFORT: ${TRANSLATION_REASONING_EFFORT:-low}
  PATTERNS_MODEL: ${PATTERNS_MODEL:-gpt-6.1-sol}
  PATTERNS_REASONING_EFFORT: ${PATTERNS_REASONING_EFFORT:-medium}
  CODE_TAGS_MODEL: ${CODE_TAGS_MODEL:-gpt-6.1-sol}
  CODE_TAGS_REASONING_EFFORT: ${CODE_TAGS_REASONING_EFFORT:-low}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  SCREEN_MODEL: ${SCREEN_MODEL:-gpt-6-luna}
  SCREEN_REASONING_EFFORT: ${SCREEN_REASONING_EFFORT:-none}

x-rounds-env: &rounds-env
  DATABASE_URL: postgresql://rounds:${POSTGRES_PASSWORD}@postgres:5432/rounds
  REDIS_URL: redis://redis:6379
  LIBRARY_URL: http://library:8000
  SERVICE_SECRET: ${SERVICE_SECRET}

x-companies-env: &companies-env
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  BILLING_URL: http://billing:8000
  DATABASE_URL: postgresql://companies:${POSTGRES_PASSWORD}@postgres:5432/companies
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  GENERATION_URL: http://generation:8000
  LIBRARY_URL: http://library:8000
  ROUNDS_URL: http://rounds:8000
  ACCOUNTS_URL: http://accounts:8000
  # How many integrations a company has working, for its menu.
  ATS_URL: http://ats:8000
  NOTIFICATIONS_URL: http://notifications:8000
  API_URL: http://api:8000
  ASSISTANT_URL: http://assistant:8000

# Each service's mounted source; migrations read it too, so new ones run without a rebuild.
x-library-source: &library-source
  - ./services/library/src:/services/library/src
  - ./services/library/migrations:/services/library/migrations
  - ./services/library/alembic.ini:/services/library/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-generation-source: &generation-source
  - ./services/generation/src:/services/generation/src
  - ./services/generation/migrations:/services/generation/migrations
  - ./services/generation/alembic.ini:/services/generation/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-rounds-source: &rounds-source
  - ./services/rounds/src:/services/rounds/src
  - ./services/rounds/migrations:/services/rounds/migrations
  - ./services/rounds/alembic.ini:/services/rounds/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

x-companies-source: &companies-source
  - ./services/companies/src:/services/companies/src
  - ./services/companies/migrations:/services/companies/migrations
  - ./services/companies/alembic.ini:/services/companies/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

services:
  # Gives each service its own Postgres user owning only its database, as in production (the
  # db-roles job, database/roles), before any migration runs; safe to repeat. Locally every
  # user's password is POSTGRES_PASSWORD.
  db-roles:
    restart: "no"
    build:
      context: database/roles
      target: dev
    volumes:
      - ./database/roles/src:/database/roles/src
    environment:
      ADMIN_DATABASE_URL: postgresql://prepza:${POSTGRES_PASSWORD}@postgres:5432/postgres
      DATABASE_URL_LIBRARY: postgresql://library:${POSTGRES_PASSWORD}@postgres:5432/library
      DATABASE_URL_GENERATION: postgresql://generation:${POSTGRES_PASSWORD}@postgres:5432/generation
      DATABASE_URL_ROUNDS: postgresql://rounds:${POSTGRES_PASSWORD}@postgres:5432/rounds
      DATABASE_URL_COMPANIES: postgresql://companies:${POSTGRES_PASSWORD}@postgres:5432/companies
      DATABASE_URL_BILLING: postgresql://billing:${POSTGRES_PASSWORD}@postgres:5432/billing
      DATABASE_URL_NOTIFICATIONS: postgresql://notifications:${POSTGRES_PASSWORD}@postgres:5432/notifications
      DATABASE_URL_ATS: postgresql://ats:${POSTGRES_PASSWORD}@postgres:5432/ats
      DATABASE_URL_API: postgresql://api:${POSTGRES_PASSWORD}@postgres:5432/api
      DATABASE_URL_ASSISTANT: postgresql://assistant:${POSTGRES_PASSWORD}@postgres:5432/assistant
      DATABASE_URL_ACCOUNTS: postgresql://accounts:${POSTGRES_PASSWORD}@postgres:5432/accounts
      DATABASE_URL_SITE: postgresql://site:${POSTGRES_PASSWORD}@postgres:5432/site
    depends_on:
      postgres:
        condition: service_healthy

  library-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/library/Dockerfile
      target: dev
    volumes: *library-source
    environment: *library-env

  library:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/library/Dockerfile
      target: dev
    volumes: *library-source
    environment: *library-env
    depends_on:
      library-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  generation-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    environment: *generation-env

  generation:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    environment:
      <<: *generation-env
      # Re-generating a single question runs in the request, not in the worker.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      generation-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Runs jobs (Cloud Tasks in Google Cloud; called directly here) and scheduled work.
  generation-worker:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/generation/Dockerfile
      target: dev
    volumes: *generation-source
    command:
      [
        "uvicorn", "generation.worker_main:app", "--host", "0.0.0.0",
        "--port", "8000", "--no-server-header", "--reload", "--reload-dir", "src",
        "--reload-dir", "/packages/common/src",
      ]
    environment:
      <<: *generation-env
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      generation-migrate:
        condition: service_completed_successfully
      library:
        condition: service_healthy

  rounds-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/rounds/Dockerfile
      target: dev
    volumes: *rounds-source
    environment: *rounds-env

  rounds:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/rounds/Dockerfile
      target: dev
    volumes: *rounds-source
    environment: *rounds-env
    depends_on:
      rounds-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  companies-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/companies/Dockerfile
      target: dev
    volumes: *companies-source
    environment: *companies-env

  companies:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/companies/Dockerfile
      target: dev
    volumes: *companies-source
    environment: *companies-env
    depends_on:
      companies-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      generation:
        condition: service_healthy
      library:
        condition: service_healthy
      rounds:
        condition: service_healthy

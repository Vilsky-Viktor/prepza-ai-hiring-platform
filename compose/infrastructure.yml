# Postgres, Redis and the local stand-ins for Google Cloud and email: Pub/Sub, the Firebase Auth
# emulator, Mailpit.

services:
  postgres:
    restart: unless-stopped
    build: database
    environment:
      POSTGRES_USER: prepza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prepza"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Google's Pub/Sub emulator: events between services, pushed like in Google Cloud. It keeps
  # nothing over a restart, so each start creates the topic and push subscriptions again; it's
  # healthy once they exist, and the container stops when the emulator does.
  pubsub:
    restart: unless-stopped
    image: google/cloud-sdk:589.0.0-emulators@sha256:c90e4a90a79d363c2aea51824f00bd6c3932c74927a4ab120f33775cbb48a762
    command:
      - sh
      - -c
      - >-
        gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=${FIREBASE_PROJECT_ID} &
        sh /pubsub-setup.sh && wait
    volumes:
      - ./scripts/local/pubsub-setup.sh:/pubsub-setup.sh:ro
    environment:
      PUBSUB_EMULATOR_HOST: localhost:8085
      GOOGLE_CLOUD_PROJECT: ${FIREBASE_PROJECT_ID}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/v1/projects/${FIREBASE_PROJECT_ID}/subscriptions/accounts-events"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports:
      # Web UI with every email sent locally.
      - "8125:8025"
  firebase-auth:
    restart: unless-stopped
    build: firebase
    ports:
      - "9199:9199"
      - "4100:4100"
    volumes:
      # Emulator users survive restarts, so the user ids stored in the databases stay valid.
      - firebase-data:/firebase/data
    # The emulator saves its users on a graceful stop; give it time to finish.
    stop_signal: SIGINT
    stop_grace_period: 30s

volumes:
  postgres-data:
  firebase-data:

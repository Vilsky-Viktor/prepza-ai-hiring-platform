# The site, the service serving its content (the FAQ, guides, legal texts, the contact form and
# news), the gateway in front of it and the services (http://localhost:8090), and the scheduled
# jobs.

x-site-env: &site-env
  DATABASE_URL: postgresql://site:${POSTGRES_PASSWORD}@postgres:5432/site
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}
  # Today's prices, which the FAQ and the platform guide name.
  BILLING_URL: http://billing:8000
  # The "I'm not a robot" check on the contact form.
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  # Translates news posts.
  GENERATION_URL: http://generation:8000

# Its mounted source; migrations read it too, so new ones run without a rebuild.
x-site-source: &site-source
  - ./services/site/src:/services/site/src
  - ./services/site/migrations:/services/site/migrations
  - ./services/site/alembic.ini:/services/site/alembic.ini:ro
  - ./packages/common/src:/packages/common/src
  # The site's guide articles, which the help routes serve too.
  - ./frontend/content:/frontend/content:ro

services:
  site-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/site/Dockerfile
      target: dev
    volumes: *site-source
    environment: *site-env

  site:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/site/Dockerfile
      target: dev
    volumes: *site-source
    environment: *site-env
    depends_on:
      site-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: frontend
      target: dev
    environment:
      # Server-side rendering calls the API through the gateway.
      API_URL: http://gateway:8081
      SITE_URL: ${SITE_URL:-http://localhost:8090}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      FRONTEND_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./frontend:/frontend
      - frontend-modules:/frontend/node_modules
      - frontend-next:/frontend/.next

  # The site the browser tests open (the gateway's port 8082): a production build of the frontend,
  # so tests never wait on the dev server above compiling pages, and never slow it down. Only the
  # test scripts start it (e2e_tests/test_frontend.sh), rebuilt when the frontend's files change;
  # the label names the files it was built from. NEXT_PUBLIC_* values are baked in at build time.
  frontend-test:
    profiles: [test]
    restart: unless-stopped
    build:
      context: frontend
      target: prod
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-development}
    labels:
      prepza.frontend-source: ${FRONTEND_TEST_SOURCE:-}
    environment:
      API_URL: http://gateway:8081
      SITE_URL: ${SITE_URL:-http://localhost:8090}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
    # Ready once it serves a page (`up --wait` waits for this).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 2s
      timeout: 5s
      retries: 30

  gateway:
    restart: unless-stopped
    image: nginx:1.29.8-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      library:
        condition: service_healthy
      generation:
        condition: service_healthy
      rounds:
        condition: service_healthy
      companies:
        condition: service_healthy
      frontend:
        condition: service_started

  # Local stand-in for Cloud Scheduler (see scripts/local/crontab).
  scheduler:
    restart: unless-stopped
    image: alpine:3.22.6@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    # Cron reads only a crontab owned by root, so the mounted one is copied into place.
    command: sh -c "apk add --no-cache curl >/dev/null && cp /crontab /etc/crontabs/root && crond -f -l 2"
    volumes:
      - ./scripts/local/crontab:/crontab:ro
    depends_on:
      generation-worker:
        condition: service_healthy
      companies:
        condition: service_healthy

volumes:
  frontend-modules:
  frontend-next:

# The site, the service serving its content (the FAQ, guides, legal texts, the contact form and
# news), the gateway in front of it and the services (http://localhost:8090), and the scheduled
# jobs.

x-site-env: &site-env
  DATABASE_URL: postgresql://site:${POSTGRES_PASSWORD}@postgres:5432/site
  REDIS_URL: redis://redis:6379
  SERVICE_SECRET: ${SERVICE_SECRET}

# Its mounted source; migrations read it too, so new ones run without a rebuild.
x-site-source: &site-source
  - ./services/site/src:/services/site/src
  - ./services/site/migrations:/services/site/migrations
  - ./services/site/alembic.ini:/services/site/alembic.ini:ro
  - ./packages/common/src:/packages/common/src

services:
  site-migrate:
    extends: {file: compose/base.yml, service: migrate}
    build:
      context: .
      dockerfile: services/site/Dockerfile
      target: dev
    volumes: *site-source
    environment: *site-env

  site:
    extends: {file: compose/base.yml, service: server}
    build:
      context: .
      dockerfile: services/site/Dockerfile
      target: dev
    volumes: *site-source
    environment: *site-env
    depends_on:
      site-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: frontend
      target: dev
    environment:
      # Server-side rendering calls the API through the gateway.
      API_URL: http://gateway:8081
      SITE_URL: ${SITE_URL:-http://localhost:8090}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL: ${NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      FRONTEND_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./frontend:/frontend
      - frontend-modules:/frontend/node_modules
      - frontend-next:/frontend/.next
  gateway:
    restart: unless-stopped
    image: nginx:1.29.8-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      library:
        condition: service_healthy
      generation:
        condition: service_healthy
      rounds:
        condition: service_healthy
      companies:
        condition: service_healthy
      frontend:
        condition: service_started

  # Local stand-in for Cloud Scheduler (see scripts/local/crontab).
  scheduler:
    restart: unless-stopped
    image: alpine:3.22.6@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    # Cron reads only a crontab owned by root, so the mounted one is copied into place.
    command: sh -c "apk add --no-cache curl >/dev/null && cp /crontab /etc/crontabs/root && crond -f -l 2"
    volumes:
      - ./scripts/local/crontab:/crontab:ro
    depends_on:
      generation-worker:
        condition: service_healthy
      companies:
        condition: service_healthy

volumes:
  frontend-modules:
  frontend-next:

# Local development only. Every app image is built from its Dockerfile's `dev` target, with the
# source mounted so the servers reload on change. Production images come from the `prod` targets
# (see README); deploy them with your own orchestration.
#
# The stack is split by kind into compose/; paths in every file are relative to this folder.
# compose/base.yml holds what every API service and its migrations share (they extend it).

name: testee

include:
  - path: compose/infrastructure.yml
    project_directory: .
  - path: compose/services.yml
    project_directory: .
  - path: compose/integrations.yml
    project_directory: .
  - path: compose/web.yml
    project_directory: .
